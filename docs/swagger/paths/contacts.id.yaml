# docs/swagger/paths/contacts.id.yaml
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string }

get:
  tags: [Contacts]
  summary: Get contact by id
  operationId: getContactById
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

patch:
  tags: [Contacts]
  summary: Update contact (JSON or multipart)
  operationId: updateContact
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateContactJSON.yaml
      multipart/form-data:
        schema:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            favorite: { type: boolean }
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

delete:
  tags: [Contacts]
  summary: Delete contact
  operationId: deleteContact
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Deleted
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml
