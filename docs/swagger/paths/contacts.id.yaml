# docs/swagger/paths/contacts.id.yaml
patch:
  tags:
    - Contacts
  summary: Update contact by id (multipart/form-data)
  operationId: updateContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      description: Contact ID (Mongo ObjectId)
      schema:
        type: string
        example: '66b2f0c0c5a0d94d2b8c5678'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          description: Send only fields you actually update.
          properties:
            name:
              type: string
              example: 'Alice Test'
            email:
              type: string
              format: email
              example: 'alice@example.com'
            phoneNumber:
              type: string
              example: '+380501234567'
            isFavourite:
              type: boolean
              example: true
            contactType:
              type: string
              description: 'One of: work, home, personal, etc.'
              example: 'work'
            photo:
              type: string
              format: binary
              description: New contact photo file
        encoding:
          photo:
            contentType: image/jpeg, image/png, image/webp
  responses:
    '200':
      description: Successfully patched a contact.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/SuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/Contact'
          examples:
            updated:
              value:
                status: success
                message: Successfully patched a contact!
                data:
                  _id: '66b2f0c0c5a0d94d2b8c5678'
                  name: 'Alice Test'
                  email: 'alice@example.com'
                  phoneNumber: '+380501234567'
                  isFavourite: true
                  contactType: 'work'
                  photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                  userId: '6698c7360e59d8758205404f'
                  createdAt: '2025-08-14T19:10:04.073Z'
                  updatedAt: '2025-08-16T12:00:00.000Z'
    '400':
      $ref: '../../openapi.yaml#/components/responses/Error'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Error'
    '404':
      $ref: '../../openapi.yaml#/components/responses/Error'
