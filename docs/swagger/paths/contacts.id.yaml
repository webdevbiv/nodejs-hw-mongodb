# docs/swagger/paths/contacts.id.yaml
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string }
    description: Mongo ObjectId of the contact

get:
  tags: [Contacts]
  summary: Get contact by id
  operationId: getContactById
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
          examples:
            found:
              value:
                _id: '66b2f0c0c5a0d94d2b8c5678'
                name: 'John Doe'
                email: 'john@example.com'
                phone: '+380501112233'
                favorite: false
                photo: null
                createdAt: '2025-08-16T09:15:27.000Z'
                updatedAt: '2025-08-16T09:15:27.000Z'
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

patch:
  tags: [Contacts]
  summary: Update contact (JSON or multipart)
  operationId: updateContact
  description: >
    Accepts JSON fields and/or multipart/form-data with a `photo` file to
    replace the existing contact photo.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateContactJSON.yaml
      multipart/form-data:
        schema:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            favorite: { type: boolean }
            photo:
              type: string
              format: binary
              description: New contact photo file
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
          examples:
            updated:
              value:
                _id: '66b2f0c0c5a0d94d2b8c5678'
                name: 'Johnathan Doe'
                email: 'john.new@example.com'
                phone: '+380501112299'
                favorite: true
                photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                createdAt: '2025-08-16T09:15:27.000Z'
                updatedAt: '2025-08-16T12:45:10.000Z'
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

delete:
  tags: [Contacts]
  summary: Delete contact
  operationId: deleteContact
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Deleted
    '401':
      $ref: ../components/responses/Error.yaml
    '404':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml
