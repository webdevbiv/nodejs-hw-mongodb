# docs/swagger/paths/contacts.yaml
get:
  tags:
    - Contacts
  summary: List contacts (paginated)
  operationId: listContacts
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: isFavourite
      description: Filter by favourite flag
      schema:
        type: boolean
    - in: query
      name: page
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    - in: query
      name: limit
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/SuccessBase'
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - contacts
                      - page
                      - limit
                      - totalItems
                      - totalPages
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: '../../openapi.yaml#/components/schemas/Contact'
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      totalItems:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 3
          examples:
            list:
              value:
                status: success
                message: Successfully found contacts!
                data:
                  contacts:
                    - _id: '66b2f0c0c5a0d94d2b8c5678'
                      name: 'Alice Test'
                      email: 'alice@example.com'
                      phoneNumber: '+380501234567'
                      isFavourite: true
                      contactType: 'work'
                      photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                      userId: '6698c7360e59d8758205404f'
                      createdAt: '2025-08-14T19:10:04.073Z'
                      updatedAt: '2025-08-14T19:34:07.478Z'
                    - _id: '66b2f0c0c5a0d94d2b8c5679'
                      name: 'Bob'
                      email: 'bob@example.com'
                      phoneNumber: '+380971112233'
                      isFavourite: false
                      contactType: 'home'
                      photo: null
                      userId: '6698c7360e59d8758205404f'
                      createdAt: '2025-08-15T12:19:59.205Z'
                      updatedAt: '2025-08-15T12:19:59.205Z'
                  page: 1
                  limit: 20
                  totalItems: 42
                  totalPages: 3
    '400':
      $ref: '../../openapi.yaml#/components/responses/Error'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Error'

post:
  tags:
    - Contacts
  summary: Create contact (multipart/form-data)
  operationId: createContact
  description: >
    Accepts multipart/form-data only. Send only fields that are actually posted.
    Server stores uploaded `photo` and saves its URL to the contact.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - name
            - email
            - phoneNumber
          properties:
            name:
              type: string
              example: 'Alice Test'
            email:
              type: string
              format: email
              example: 'alice@example.com'
            phoneNumber:
              type: string
              example: '+380501234567'
            isFavourite:
              type: boolean
              example: true
            contactType:
              type: string
              description: 'One of: work, home, personal, etc.'
              example: 'work'
            photo:
              type: string
              format: binary
              description: Contact photo file
        encoding:
          photo:
            contentType: image/jpeg, image/png, image/webp
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/SuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/Contact'
          examples:
            created:
              value:
                status: success
                message: Successfully created a contact!
                data:
                  _id: '66b2f0c0c5a0d94d2b8c5680'
                  name: 'Alice Test'
                  email: 'alice@example.com'
                  phoneNumber: '+380501234567'
                  isFavourite: true
                  contactType: 'work'
                  photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                  userId: '6698c7360e59d8758205404f'
                  createdAt: '2025-08-16T11:03:44.000Z'
                  updatedAt: '2025-08-16T11:03:44.000Z'
    '400':
      $ref: '../../openapi.yaml#/components/responses/Error'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Error'
