# docs/swagger/paths/contacts.yaml
get:
  tags: [Contacts]
  summary: List contacts
  operationId: listContacts
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: isFavourite
      schema: { type: boolean }
      description: Filter by favourite flag
    - in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/SuccessBase.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/Contact.yaml
          examples:
            list:
              value:
                status: success
                message: Successfully found contacts!
                data:
                  - _id: '66b2f0c0c5a0d94d2b8c5678'
                    name: 'Alice Test'
                    email: 'alice@example.com'
                    phoneNumber: '+380501234567'
                    isFavourite: true
                    contactType: 'work'
                    photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                    userId: '6698c7360e59d8758205404f'
                    createdAt: '2025-08-14T19:10:04.073Z'
                    updatedAt: '2025-08-14T19:34:07.478Z'
                  - _id: '66b2f0c0c5a0d94d2b8c5679'
                    name: 'Bob'
                    email: 'bob@example.com'
                    phoneNumber: '+380971112233'
                    isFavourite: false
                    contactType: 'home'
                    photo: null
                    userId: '6698c7360e59d8758205404f'
                    createdAt: '2025-08-15T12:19:59.205Z'
                    updatedAt: '2025-08-15T12:19:59.205Z'
    '401':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

post:
  tags: [Contacts]
  summary: Create contact (JSON or multipart)
  operationId: createContact
  description: >
    Accepts JSON or multipart/form-data with a `photo` file. If a file is
    provided, the server uploads it (e.g., to Cloudinary) and stores the URL.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateContactJSON.yaml
        examples:
          sample:
            value:
              name: 'Alice Test'
              email: 'alice@example.com'
              phoneNumber: '+380501234567'
              isFavourite: true
              contactType: 'work'
      multipart/form-data:
        schema:
          type: object
          required: [name, email, phoneNumber]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phoneNumber: { type: string }
            isFavourite: { type: boolean }
            contactType: { type: string }
            photo:
              type: string
              format: binary
              description: Contact photo file
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/SuccessBase.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/Contact.yaml
          examples:
            created:
              value:
                status: success
                message: Successfully created a contact!
                data:
                  _id: '66b2f0c0c5a0d94d2b8c5680'
                  name: 'Alice Test'
                  email: 'alice@example.com'
                  phoneNumber: '+380501234567'
                  isFavourite: true
                  contactType: 'work'
                  photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                  userId: '6698c7360e59d8758205404f'
                  createdAt: '2025-08-16T11:03:44.000Z'
                  updatedAt: '2025-08-16T11:03:44.000Z'
    '400':
      $ref: ../components/responses/Error.yaml
    '401':
      $ref: ../components/responses/Error.yaml
