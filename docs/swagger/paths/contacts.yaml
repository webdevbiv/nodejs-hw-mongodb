# docs/swagger/paths/contacts.yaml
get:
  tags: [Contacts]
  summary: List contacts
  operationId: listContacts
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: favorite
      schema: { type: boolean }
      description: Filter by favorite flag
    - in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    - in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Contact.yaml
          examples:
            list:
              value:
                data:
                  - _id: '66b2f0c0c5a0d94d2b8c5678'
                    name: 'John Doe'
                    email: 'john@example.com'
                    phone: '+380501112233'
                    favorite: false
                    photo: null
                    createdAt: '2025-08-16T09:15:27.000Z'
                    updatedAt: '2025-08-16T09:15:27.000Z'
                  - _id: '66b2f0c0c5a0d94d2b8c5679'
                    name: 'Jane Smith'
                    email: 'jane@example.com'
                    phone: '+380971112233'
                    favorite: true
                    photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                    createdAt: '2025-08-16T10:12:05.000Z'
                    updatedAt: '2025-08-16T10:12:05.000Z'
    '401':
      $ref: ../components/responses/Error.yaml
    '400':
      $ref: ../components/responses/Error.yaml

post:
  tags: [Contacts]
  summary: Create contact (JSON or multipart)
  operationId: createContact
  description: >
    Accepts JSON or multipart/form-data with a `photo` file. If a file is
    provided, the server uploads it (e.g., to Cloudinary) and stores the URL.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateContactJSON.yaml
        examples:
          sample:
            value:
              name: John Doe
              email: john@example.com
              phone: '+380501112233'
              favorite: false
      multipart/form-data:
        schema:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            favorite: { type: boolean }
            photo:
              type: string
              format: binary
              description: Contact photo file
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
          examples:
            created:
              value:
                _id: '66b2f0c0c5a0d94d2b8c5680'
                name: 'John Doe'
                email: 'john@example.com'
                phone: '+380501112233'
                favorite: false
                photo: null
                createdAt: '2025-08-16T11:03:44.000Z'
                updatedAt: '2025-08-16T11:03:44.000Z'
    '400':
      $ref: ../components/responses/Error.yaml
    '401':
      $ref: ../components/responses/Error.yaml
