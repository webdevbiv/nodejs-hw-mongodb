# docs/swagger/components/schemas/User.yaml
type: object
description: Public user representation returned by the API.
required: [_id, name, email, createdAt, updatedAt]
additionalProperties: false
properties:
  _id:
    type: string
    description: Mongo ObjectId
    pattern: '^[a-f0-9]{24}$'
    readOnly: true
    example: '6892401c0134ece992c7de3d'
  name:
    type: string
    minLength: 1
    example: 'Igor Berezhnyy'
  email:
    type: string
    format: email
    example: 'igor@example.com'
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2025-08-05T17:32:12.584Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2025-08-05T17:32:12.584Z'
