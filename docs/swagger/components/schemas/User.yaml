# docs/swagger/components/schemas/User.yaml
type: object
description: Public user representation returned by the API.
required: [_id, name, email, createdAt, updatedAt]
additionalProperties: false
properties:
  _id:
    type: string
    description: Mongo ObjectId
    pattern: '^[a-f0-9]{24}$'
    readOnly: true
    example: '66b2f0c0c5a0d94d2b8c1234'
  name:
    type: string
    minLength: 1
    example: Igor
  email:
    type: string
    format: email
    example: igor@example.com
  avatarURL:
    type: string
    format: uri-reference
    nullable: true
    description: Public URL to the user's avatar (local or CDN)
    example: '/avatars/1723819200-ava.png'
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2025-08-16T09:15:27.000Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2025-08-16T09:15:27.000Z'
