# docs/swagger/components/schemas/UpdateContactJSON.yaml
type: object
description: Partial update payload for a contact.
properties:
  name:
    type: string
    minLength: 2
    maxLength: 128
    example: 'Alice Test'
  email:
    type: string
    format: email
    example: 'alice@example.com'
  phoneNumber:
    type: string
    example: '+380500000000'
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    example: 'work'
  photo:
    type: string
    format: uri
    nullable: true
    description: Optional direct URL (usually set by the server after multipart upload)
