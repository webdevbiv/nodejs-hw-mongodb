# docs/swagger/components/schemas/Contact.yaml
type: object
description: Contact entity with optional hosted photo URL.
required: [_id, name, email, phone, createdAt, updatedAt]
properties:
  _id:
    type: string
    description: Mongo ObjectId
    example: '66b2f0c0c5a0d94d2b8c5678'
  name:
    type: string
    example: John Doe
  email:
    type: string
    format: email
    example: john@example.com
  phone:
    type: string
    example: '+380501112233'
  favorite:
    type: boolean
    default: false
    example: false
  photo:
    type: string
    nullable: true
    description: Public URL to contact photo (e.g., Cloudinary)
    example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-08-16T09:15:27.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-08-16T09:15:27.000Z'
