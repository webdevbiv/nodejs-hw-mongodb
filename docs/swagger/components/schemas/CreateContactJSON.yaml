# docs/swagger/components/schemas/CreateContactJSON.yaml
type: object
required:
  - name
  - email
  - phoneNumber
properties:
  name:
    type: string
    minLength: 2
    maxLength: 128
    example: 'Alice Test'
  email:
    type: string
    format: email
    example: 'alice@example.com'
  phoneNumber:
    type: string
    example: '+380501234567'
  isFavourite:
    type: boolean
    default: false
    example: true
  contactType:
    type: string
    example: 'work'
  photo:
    type: string
    format: uri
    nullable: true
    description: Optional direct URL; usually set by server after file upload
