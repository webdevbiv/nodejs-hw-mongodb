# redocly.yaml
extends:
  - recommended

apis:
  main:
    root: ./docs/openapi.yaml
    rules:
      no-unused-components: error
      security-defined: error
      operation-4xx-response: error
      info-license: warn
      tag-description: warn

rules:
  no-server-example.com: off

openapi:
  pagination: section
  expandResponses: '200,201,4XX'
  showExtensions: true
  htmlTemplate: ./docs/index.html

theme:
  colors:
    primary:
      main: '#32329f'
  generateCodeSamples:
    languages:
      - lang: curl
      - lang: Node.js
      - lang: JavaScript
